spring.application.name=backend
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/assessment_feedback}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:assessment_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:assessment_password}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.devtools.restart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.audio.storage-path=${APP_AUDIO_STORAGE_PATH:./data/audio}